name: EchoVoice CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test and package on macOS 26
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify runner, Xcode and SDK
        run: |
          test "$(uname -m)" = "arm64"
          xcodebuild -version
          sdk_version="$(xcrun --sdk macosx --show-sdk-version)"
          echo "macOS SDK: $sdk_version"
          test "${sdk_version%%.*}" -ge 26
      - name: Install the Metal toolchain (MLX's GPU code needs it)
        run: xcodebuild -downloadComponent MetalToolchain
      - name: Resolve and verify model integration fixes
        run: bash Scripts/prepare-models.sh
      - name: Check dependency patch safety
        run: python3 Scripts/test_model_patches.py
      - name: Run core and model frontend tests
        run: |
          xcodebuild test \
            -disableAutomaticPackageResolution \
            -scheme EchoVoice-Package \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath .xcbuild \
            -resultBundlePath .xcbuild/EchoVoice-tests.xcresult \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            -only-testing:EchoVoiceTests \
            -only-testing:EchoVoiceModelTests \
            CODE_SIGNING_ALLOWED=NO \
            -quiet
      - name: Explain test failures
        if: failure()
        run: |
          if [ -d .xcbuild/EchoVoice-tests.xcresult ]; then
            xcrun xcresulttool get test-results summary --path .xcbuild/EchoVoice-tests.xcresult --format json
          fi
      - name: Upload failing test diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: EchoVoice-test-diagnostics
          path: .xcbuild/EchoVoice-tests.xcresult
          if-no-files-found: ignore
          retention-days: 7
      - name: Build, package, and verify app bundle and ZIP
        run: bash Scripts/package-app.sh
      - name: Launch app smoke test
        run: bash Scripts/smoke-test.sh
      - name: Capture redesigned screens with an isolated fictional library
        run: dist/verify-extracted/EchoVoice.app/Contents/MacOS/EchoVoice --ci-design-review
      - name: Upload native design captures
        uses: actions/upload-artifact@v7
        with:
          name: EchoVoice-design-captures
          path: ${{ runner.temp }}/EchoVoice-design-captures/*.png
          if-no-files-found: error
          retention-days: 14
      - name: Upload finished app ZIP
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: EchoVoice-${{ github.run_number }}
          path: |
            dist/EchoVoice.zip
            dist/EchoVoice.zip.sha256
          if-no-files-found: error
          retention-days: 30


  release:
    name: Publish verified release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: EchoVoice-${{ github.run_number }}
          path: release
      - name: Verify release checksum
        working-directory: release
        run: shasum -a 256 -c EchoVoice.zip.sha256
      - name: Publish the tested ZIP and checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(python3 -c 'import plistlib; print(plistlib.load(open("Resources/Info.plist", "rb"))["CFBundleShortVersionString"])')"
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists."
          else
            gh release create "$tag" release/EchoVoice.zip release/EchoVoice.zip.sha256 \
              --target "$GITHUB_SHA" --title "EchoVoice $version" \
              --notes-file "docs/releases/$version.md"
          fi
